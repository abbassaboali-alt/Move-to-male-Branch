<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prudle – Move to Female Section</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#appFrame{width:100%;height:100vh;border:0;display:none}</style>
<script>
(function () {
  'use strict';
  const LOGIN_URL = 'https://www.prudle-education.com/log-in-out';
  const APP_URL = 'https://abbassaboali-alt.github.io/Move-to-female-section/';
  const APP_ORIGIN = new URL(APP_URL).origin;
  let redirecting = false;
  function logoutAll() {
    if (redirecting) return;
    redirecting = true;
    localStorage.clear();
    sessionStorage.clear();
    try { window.top.location.replace(LOGIN_URL); }
    catch (_) { window.location.replace(LOGIN_URL); }
  }
  function checkLoginOnly() {
    const user = localStorage.getItem('username');
    const role = String(localStorage.getItem('role') || '').trim().toLowerCase();
    const last = localStorage.getItem('loginDate');
    const today = new Date().toDateString();
    if (!user || role !== 'admin' || last !== today) {
      const frame = document.getElementById('appFrame');
      if (frame) frame.style.display = 'none';
      logoutAll();
      return false;
    }
    return true;
  }
  window.addEventListener('message', function (event) {
    if (event.origin !== APP_ORIGIN) return;
    if (event.source !== document.getElementById('appFrame')?.contentWindow) return;
    if (event.data === 'PRUDLE_LOGOUT') logoutAll();
  });
  window.addEventListener('pageshow', checkLoginOnly);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) checkLoginOnly();
  });
  document.addEventListener('DOMContentLoaded', function () {
    if (!checkLoginOnly()) return;
    const frame = document.getElementById('appFrame');
    frame.src = APP_URL;
    frame.style.display = 'block';
  });
})();
</script>
</head>
<body>
<iframe id="appFrame" title="Move to Female Section" allow="microphone; camera" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</body>
</html>
